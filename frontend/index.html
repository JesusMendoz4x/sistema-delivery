<!doctype html>
<html lang="en">

  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link
      href="https://fonts.googleapis.com/css2?family=EB+Garamond:wght@400;600;800&family=DM+Sans:wght@400;500&family=JetBrains+Mono:wght@400&display=swap"
      rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap"
      rel="stylesheet">
    <title>frontend</title>
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
    <!-- Static hero background to avoid scroll-driven animations -->
    <script>
      (function () {
        function onReady() {
          const heroFade = document.querySelector('.hero-bottom-fade');
          const heroBg = document.getElementById('hero-bg');
          const heroDark = document.getElementById('hero-dark-overlay');
          if (heroFade) heroFade.style.opacity = '1';
          if (heroBg) {
            heroBg.style.backgroundPosition = 'center 0px';
            heroBg.style.filter = 'brightness(1) contrast(1.08) saturate(0.9) blur(4px)';
          }
          if (heroDark) heroDark.style.opacity = '0';
        }
        if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', onReady);
        else onReady();
      })();
    </script>
  </body>

</html>
