<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E140F" />
      <stop offset="100%" stop-color="#0A0604" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F3E5D8" />
      <stop offset="50%" stop-color="#D4AF6A" />
      <stop offset="100%" stop-color="#AA8445" />
    </linearGradient>
    <linearGradient id="redGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#B22B3E" />
      <stop offset="100%" stop-color="#801C29" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="6" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
  </defs>
  
  <!-- Outer circle border with gold gradient -->
  <circle cx="256" cy="256" r="236" fill="url(#bgGrad)" stroke="url(#goldGrad)" stroke-width="12" />
  
  <!-- Inner gold ring decoration -->
  <circle cx="256" cy="256" r="216" fill="none" stroke="url(#goldGrad)" stroke-width="2" stroke-dasharray="8 8" opacity="0.6" />
  
  <!-- The main restaurant logo container -->
  <g filter="url(#shadow)">
    <!-- Hot Ramen Bowl -->
    <path d="M128,240 C128,340 180,390 256,390 C332,390 384,340 384,240 Z" fill="url(#redGrad)" stroke="url(#goldGrad)" stroke-width="10" stroke-linejoin="round" />
    
    <!-- Bowl rim decoration -->
    <path d="M122,240 L390,240" fill="none" stroke="url(#goldGrad)" stroke-width="12" stroke-linecap="round" />
    
    <!-- Golden Noodles waves -->
    <path d="M148,240 C170,200 200,200 220,240 C240,280 270,280 290,240 C310,200 340,200 364,240" fill="none" stroke="url(#goldGrad)" stroke-width="6" stroke-linecap="round" />
    <path d="M170,240 C190,215 210,215 230,240 C250,265 270,265 290,240 C310,215 330,215 342,240" fill="none" stroke="url(#goldGrad)" stroke-width="6" stroke-linecap="round" opacity="0.8" />
    
    <!-- Steam rising from bowl -->
    <path d="M200,160 Q180,120 200,80" fill="none" stroke="url(#goldGrad)" stroke-width="6" stroke-linecap="round" opacity="0.8" />
    <path d="M256,150 Q236,110 256,70" fill="none" stroke="url(#goldGrad)" stroke-width="6" stroke-linecap="round" />
    <path d="M312,160 Q292,120 312,80" fill="none" stroke="url(#goldGrad)" stroke-width="6" stroke-linecap="round" opacity="0.8" />
    
    <!-- Chopsticks -->
    <line x1="410" y1="180" x2="190" y2="135" stroke="url(#goldGrad)" stroke-width="10" stroke-linecap="round" />
    <line x1="415" y1="195" x2="200" y2="150" stroke="url(#goldGrad)" stroke-width="10" stroke-linecap="round" />
  </g>
</svg>